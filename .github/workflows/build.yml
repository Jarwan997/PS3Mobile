name: Build PS3 Mobile

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o PS3Mobile-Xiaomi-Starter-v0.1.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: project/PS3Mobile-Xiaomi-Starter
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PS3Mobile-debug
          path: project/PS3Mobile-Xiaomi-Starter/app/build/outputs/apk/debug/app-debug.apk
